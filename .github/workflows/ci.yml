name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  docker-build:
    name: Validate Docker image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag python-cicd-lab:${{ github.sha }} .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name python-cicd-api \
            --publish 8000:8000 \
            python-cicd-lab:${{ github.sha }}

      - name: Run container smoke test
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi

            sleep 1
          done

          docker logs python-cicd-api
          exit 1

      - name: Remove test container
        if: always()
        run: docker rm --force python-cicd-api